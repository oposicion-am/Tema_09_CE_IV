<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test · Decreto 9/2024 · Cambio de uso forestal</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Decreto 9/2024, de 6 de junio, por el que se regulan las autorizaciones de cambio de uso forestal</h1>
      <p>25 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>
    <div class="prog noprint"><span id="cnt">1 / 25</span><div class="bar"><i id="barfill"></i></div><span id="score">0 aciertos</span></div>
    <div class="card" id="stage"></div>
  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">
      <button class="btn" onclick="copyWord()">Copiar para Word</button>
      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"d": "Fácil", "q": "Según el Decreto 9/2024, ¿cuál es, con carácter general, la pendiente máxima que no deben superar los terrenos forestales para autorizar su cambio de uso con destino agrícola?", "o": ["25 %", "20 %", "10 %", "15 %"], "c": 3, "w": "Art. 5.1: los terrenos deben tener una pendiente máxima que no supere el 15 %. Por encima de ese valor solo cabe autorizar con medidas antierosivas (art. 5.2)."}, {"d": "Fácil", "q": "Concedida una autorización de cambio de uso forestal, ¿de qué plazo máximo se dispone para realizar las actuaciones que lo hagan efectivo?", "o": ["Seis meses desde la notificación, transcurridos los cuales la autorización caduca", "Dos años desde la fecha de la autorización, prorrogables por otro año a petición del interesado", "Dos años desde la fecha de la autorización; si no se realizan, queda sin efecto, pero puede presentarse una nueva solicitud sobre los mismos terrenos", "Un año desde la notificación; si no se realizan, no podrá volver a solicitarse sobre esos terrenos"], "c": 2, "w": "Art. 2.2: plazo máximo de dos años desde la fecha de la autorización. Si no se actúa, la autorización queda sin efecto, sin que decaiga el derecho a presentar una nueva solicitud sobre esos mismos terrenos."}, {"d": "Medio", "q": "¿A qué distancia del cauce de los cursos de agua de carácter permanente no podrá autorizarse, en ningún caso, el cambio de uso forestal?", "o": ["A menos de 5 metros, o a mayor distancia si así lo establece la planificación hidrológica de la cuenca", "A menos de 10 metros, en todo caso", "A menos de 25 metros, coincidiendo con la zona de servidumbre", "A menos de 100 metros, coincidiendo con la zona de policía"], "c": 0, "w": "Art. 3.i): no se autoriza en montes situados a una distancia inferior a 5 metros del cauce de cursos de agua permanentes, o a mayor distancia si lo establecen los instrumentos de planificación de la cuenca hidrográfica."}, {"d": "Medio", "q": "Un monte fue objeto de ayudas públicas para su forestación hace tres años. ¿Puede autorizarse su cambio de uso forestal?", "o": ["Sí, porque la limitación solo se aplica a las ayudas recibidas en los dos años anteriores", "No, salvo previa devolución de las ayudas o en casos de fuerza mayor o circunstancias excepcionales acreditadas", "Sí, siempre que la superficie no supere las 10 ha", "No, en ningún caso, hasta que transcurran diez años desde la ayuda"], "c": 1, "w": "Art. 3.j): no se autoriza en montes que hubieran recibido ayudas públicas para forestación o mejora forestal en los cinco años anteriores, salvo previa devolución o fuerza mayor/circunstancias excepcionales acreditadas según las normas reguladoras de las ayudas."}, {"d": "Medio", "q": "¿A qué montes NO es de aplicación el Decreto 9/2024, que se rigen por su normativa específica?", "o": ["A los montes catalogados de utilidad pública, protectores y con régimen de protección especial", "A los montes incluidos en espacios naturales protegidos y en la Red Natura 2000", "A los montes de particulares y a los montes vecinales en mano común", "A los montes con instrumento de ordenación forestal aprobado"], "c": 0, "w": "Art. 1.2: el Decreto no se aplica a los montes catalogados de utilidad pública, protectores y con régimen de protección especial; también quedan excluidos los supuestos del art. 88.3 de la Ley 3/2009 (interfaz urbano-forestal)."}, {"d": "Alto", "q": "Respecto a los hábitats de interés prioritario del Anexo I de la Directiva 92/43/CEE, ¿en qué caso prohíbe expresamente el Decreto el cambio de uso forestal?", "o": ["Cuando el monte se sitúe en un hábitat prioritario catalogado dentro del grupo de los bosques", "Cuando el monte se sitúe en cualquier hábitat prioritario, sea cual sea su grupo", "Cuando el hábitat prioritario ocupe más del 50 % de la superficie solicitada", "Solo cuando el hábitat prioritario esté además incluido en un espacio natural protegido"], "c": 0, "w": "Art. 3.k): no se autoriza en montes situados en un hábitat de interés prioritario del Anexo I de la Directiva 92/43/CEE catalogado dentro del grupo de los bosques."}, {"d": "Medio", "q": "Para acogerse a la excepcionalidad del art. 5.1.a) (terrenos que fueron cultivados), ¿dentro de qué periodo deben haber sido destinados al cultivo agrícola y qué terrenos quedan excluidos?", "o": ["Dentro de los 20 años anteriores a la solicitud; se excluyen los terrenos con pendiente superior al 15 %", "Dentro de los 30 años anteriores a la solicitud; se excluyen los terrenos adehesados agro-silvopastorales con cultivos intercalados", "Dentro de los 30 años anteriores a la solicitud; se excluyen las plantaciones de chopo y eucalipto", "Dentro de los 50 años anteriores a la solicitud; se excluyen las masas arboladas naturales"], "c": 1, "w": "Art. 5.1.a): terrenos forestales del art. 2.2.c) de la Ley 3/2009 destinados al cultivo agrícola en los 30 años anteriores a la solicitud y aptos técnica y económicamente. No se incluyen los terrenos adehesados de condición mixta agro-silvopastoral con cultivos agrícolas intercalados."}, {"d": "Medio", "q": "Cuando el cambio de uso tiene por objeto implantar cultivos de alto interés en terrenos no cultivados en los últimos 30 años, ¿qué superficie máxima puede solicitarse?", "o": ["5 ha", "50 ha", "100 ha", "10 ha"], "c": 2, "w": "Art. 5.1.b): la superficie cuyo cambio de uso se solicita no puede superar las 100 ha, además de no existir terrenos agrícolas adecuados disponibles y ser aptos técnica y económicamente."}, {"d": "Alto", "q": "En el supuesto de cultivos de alto interés, si el cambio de uso afecta a una masa arbolada aislada de más de 10 ha, ¿qué límite se establece?", "o": ["No puede suponer el cambio de uso de más del 50 % de su superficie", "No puede suponer el cambio de uso de más del 25 % de su superficie", "Debe compensarse con el triple de superficie reforestada", "No puede autorizarse en ningún caso"], "c": 0, "w": "Art. 5.1.b): cuando afecten a una masa arbolada aislada de más de 10 ha, no podrá suponer el cambio de uso de más del 50 % de su superficie."}, {"d": "Alto", "q": "¿Cuál de los siguientes NO es uno de los criterios que definen un 'cultivo de alto interés' según el Decreto 9/2024?", "o": ["Cultivos de secano destinados a la alimentación animal", "Cultivos que permitan evitar la propagación de incendios forestales en enclaves estratégicos", "Cultivos con un rendimiento económico por unidad de superficie superior en un 50 % a la media de la comarca", "Cultivos integrados en denominaciones de origen o indicaciones geográficas protegidas"], "c": 0, "w": "Art. 5.1.b): entre los cultivos de alto interés figuran los de regadío destinados a la alimentación humana (no los de secano para alimentación animal), los de rendimiento superior en un 50 % a la media comarcal, los integrados en DOP/IGP, los que evitan la propagación de incendios, los de especies silvestres de los montes, las variedades de conservación y los que requieren condiciones edáficas o climáticas especiales."}, {"d": "Medio", "q": "Para una reorganización más eficiente de la explotación agraria sobre terrenos desarbolados o arbolados de origen no natural con edad media inferior a 50 años, ¿cuál es la superficie máxima solicitable?", "o": ["50 ha", "5 ha", "100 ha", "10 ha"], "c": 3, "w": "Art. 5.1.c): terrenos desarbolados o arbolados de origen no natural con edad media inferior a 50 años; la superficie solicitada no puede superar las 10 ha."}, {"d": "Medio", "q": "Si la reorganización de la explotación agraria afecta a masas arboladas naturales o de origen no natural con edad media superior a 50 años, la superficie solicitada debe ser:", "o": ["Inferior a 1 ha", "Inferior a 5 ha", "No superior a 100 ha", "No superior a 10 ha"], "c": 1, "w": "Art. 5.1.d): en masas naturales o artificiales de más de 50 años de edad media, la superficie cuyo cambio de uso se solicita debe ser inferior a 5 ha."}, {"d": "Fácil", "q": "Cuando los terrenos superan el 15 % de pendiente, ¿qué debe garantizarse además para poder autorizar el cambio de uso con destino agrícola?", "o": ["Que la superficie solicitada sea inferior a 1 ha", "Que el terreno se dedique exclusivamente a cultivos leñosos de regadío", "Que se obtenga una declaración de impacto ambiental favorable", "La adopción de medidas para evitar procesos erosivos significativos, como terrazas, bancales o cubiertas herbáceas permanentes"], "c": 3, "w": "Art. 5.2: con pendiente superior al 15 % se exige que concurra alguna circunstancia del apartado 1 y que se garanticen medidas para evitar procesos erosivos significativos (terrazas, bancales, cubiertas herbáceas permanentes o análogas)."}, {"d": "Alto", "q": "Para asegurar el mantenimiento de los servicios ecosistémicos en los supuestos del art. 5.1 b), c) y d), cuando no se implanten cultivos leñosos arbóreos, se exige adscribir al uso forestal otros terrenos agrícolas. ¿Qué requisitos deben cumplir?", "o": ["Superficie al menos la mitad de la del cambio y ubicación en cualquier punto de la Comunidad", "Superficie al menos igual a la del cambio, calificación SIGPAC FO exclusivamente y ubicación en el mismo término municipal", "Superficie al menos el doble de la del cambio, calificación SIGPAC TA y ubicación en la misma provincia", "Superficie al menos igual a la del cambio, calificación SIGPAC modificada a FO, PA, PS, MT o PR y ubicación en el entorno comarcal"], "c": 3, "w": "Art. 5.3: los terrenos adscritos deben tener al menos la misma superficie, modificar su uso SIGPAC a FO, PA, PS, MT o PR y estar en el entorno comarcal de los montes; si el cambio afecta a terrenos arbolados, además se exige plan de reforestación y mantenimiento."}, {"d": "Alto", "q": "Si el cambio de uso afecta a masas arboladas naturales o a masas de origen no natural de más de 50 años, ¿cómo se incrementa la compensación?", "o": ["La superficie a adscribir se duplica, sin alternativa posible", "Se exige una fianza del 50 % del valor de la madera", "La superficie a adscribir se incrementa en el 50 % de la del cambio, o bien se asume el compromiso de mejora forestal en esa superficie adicional", "La superficie a adscribir se incrementa en el 25 % de la del cambio"], "c": 2, "w": "Art. 5.3.e): la superficie a adscribir se incrementa en el 50 % de la de los terrenos objeto del cambio, o bien se asume el compromiso de realizar actuaciones de mejora del estado forestal en terrenos forestales de esa superficie adicional."}, {"d": "Medio", "q": "Si los terrenos solicitados han sufrido en los últimos 10 años un aprovechamiento forestal o un episodio de destrucción que modificó sustancialmente la cubierta arbórea, ¿cómo se resolverá la autorización?", "o": ["Basándose en el estado actual de los terrenos tras el aprovechamiento", "Se denegará automáticamente durante 30 años", "Se aplicará siempre el procedimiento simplificado de reversión", "Basándose en los parámetros y condiciones previos al aprovechamiento o destrucción"], "c": 3, "w": "Art. 5.4: sin perjuicio del art. 50 de la Ley 43/2003 y del art. 92.2 de la Ley 3/2009, la autorización se basará en los parámetros y condiciones previos al aprovechamiento o destrucción."}, {"d": "Medio", "q": "En los procedimientos de concentración parcelaria que incluyan montes, ¿cómo se delimitan los terrenos forestales que pasarán a uso agrícola y los agrícolas que quedarán adscritos al uso forestal?", "o": ["Mediante acuerdo de la Junta de Castilla y León tras el acuerdo de concentración", "Mediante resolución conjunta de las Direcciones Generales competentes en montes y en concentración parcelaria, antes de aprobar las bases definitivas", "Mediante informe no vinculante del servicio territorial de medio ambiente tras aprobar las bases definitivas", "Mediante resolución de la Delegación Territorial, previa audiencia de los propietarios"], "c": 1, "w": "Art. 6: se delimitan conjuntamente en las bases de concentración mediante resolución conjunta de la DG competente en montes y la DG competente en concentración parcelaria, con carácter previo a la aprobación de las bases definitivas."}, {"d": "Medio", "q": "En el procedimiento de autorización de uso excepcional en suelo rústico (art. 23 de la Ley 5/1999, de Urbanismo de Castilla y León) que conlleve la pérdida de la condición de monte, la consejería competente en materia de montes emitirá un informe:", "o": ["Facultativo y no vinculante", "Preceptivo y no vinculante", "Facultativo y vinculante", "Preceptivo y vinculante"], "c": 3, "w": "Art. 8: se remite el expediente a la consejería competente en montes para que emita informe preceptivo y vinculante sobre si procede el cambio de uso forestal; sin ese informe no se autoriza el cambio."}, {"d": "Medio", "q": "¿Qué órgano instruye el procedimiento cuando la solicitud de cambio de uso forestal incluye terrenos situados en varias provincias de Castilla y León?", "o": ["La Delegación Territorial de la provincia con mayor superficie afectada", "El servicio territorial competente en materia de montes de la provincia con mayor superficie de terrenos solicitados", "El servicio territorial de la provincia donde se presentó la solicitud", "La Dirección General competente en materia de montes"], "c": 1, "w": "Art. 11.1: instruye el servicio territorial competente en montes de la provincia donde radiquen los terrenos; si hay terrenos de varias provincias, el de la provincia con mayor superficie objeto de solicitud."}, {"d": "Fácil", "q": "Si la solicitud no reúne los requisitos o no va acompañada de la documentación necesaria, ¿qué plazo se concede para subsanarla?", "o": ["Cinco días", "Quince días", "Diez días", "Un mes"], "c": 2, "w": "Art. 11.2: se requerirá al solicitante para que subsane en un plazo de diez días, con indicación de que, si no lo hace, se le tendrá por desistido previa resolución (art. 21 de la Ley 39/2015)."}, {"d": "Medio", "q": "En el trámite de audiencia previo a la propuesta de resolución, ¿qué plazo tienen los interesados para presentar alegaciones?", "o": ["No inferior a diez días ni superior a quince", "No inferior a quince días ni superior a veinte", "Un mes", "Exactamente diez días"], "c": 0, "w": "Art. 11.4: inmediatamente antes de redactar la propuesta de resolución se da audiencia a los interesados (al menos el titular de los terrenos) por un plazo no inferior a diez días ni superior a quince."}, {"d": "Fácil", "q": "¿Qué órgano resuelve una solicitud de cambio de uso forestal que afecta a 8 ha situadas en una sola provincia?", "o": ["La persona titular de la consejería competente en materia de montes", "La Delegación Territorial de la Junta de Castilla y León en esa provincia", "La Dirección General competente en materia de montes", "El servicio territorial competente en materia de montes"], "c": 1, "w": "Art. 12.1: resuelve la Delegación Territorial de la provincia cuando se afecten menos de 10 ha. La Dirección General resuelve las de 10 ha o más y las que afecten a varias provincias, sea cual sea su superficie."}, {"d": "Medio", "q": "¿Cuál es el plazo máximo para resolver y notificar la autorización de cambio de uso forestal en el procedimiento ordinario y cuál es el sentido del silencio?", "o": ["Tres meses; silencio estimatorio", "Dos meses; silencio desestimatorio", "Seis meses; silencio desestimatorio", "Seis meses; silencio estimatorio"], "c": 2, "w": "Art. 12.2: seis meses, con silencio desestimatorio por el posible perjuicio grave al medio ambiente. El plazo puede suspenderse cuando deba solicitarse declaración de impacto ambiental, sin exceder nunca de tres meses."}, {"d": "Fácil", "q": "¿Cuál es el plazo máximo para resolver y notificar el procedimiento simplificado de reversión al uso agrícola?", "o": ["Dos meses", "Seis meses", "Un mes", "Tres meses"], "c": 0, "w": "Art. 13.7: el procedimiento simplificado debe resolverse y notificarse en dos meses; su vencimiento sin notificación permite entender desestimada la solicitud."}, {"d": "Alto", "q": "Una plantación temporal de clones de chopo de producción se instaló sobre terrenos agrícolas. ¿Cuándo puede su titular retornar al uso agrícola sin tramitar procedimiento de cambio de uso?", "o": ["Una vez transcurridos diez años desde su implantación", "Nunca; siempre debe tramitar el procedimiento simplificado", "Una vez transcurridos cinco años desde su implantación", "En cualquier momento, tras el primer turno de corta"], "c": 2, "w": "Art. 13.2: las plantaciones temporales de chopo o Eucalyptus siguen el procedimiento simplificado, pero las de clones de chopo instaladas sobre terrenos agrícolas pueden volver al uso agrícola sin procedimiento una vez transcurridos cinco años desde su implantación (art. 5.4 de la Ley 43/2003)."}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
